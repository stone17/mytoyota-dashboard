<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyToyota Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ cache_buster }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <style>
        #vehicle-container {
            display: grid;
            grid-template-columns: 1fr; /* Each vehicle gets its own row */
            gap: 20px;
        }
        .vehicle-wrapper {
            background: var(--card-bg); /* updated */
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            padding: 20px;
        }
        /* --- New Header Styles --- */
        .vehicle-header {
            display: flex;
            justify-content: space-between; /* Pushes title left, controls right */
            align-items: center;          /* Vertically aligns items */
            flex-wrap: wrap;              /* Allows controls to wrap below on small screens */
            gap: 10px 20px;               /* Adds space between items when they wrap */
            margin-bottom: 15px;          /* Space below the header */
        }
        .vehicle-controls {
            display: flex;
            align-items: center;
            gap: 15px;                    /* Space between button and last-updated text */
            flex-shrink: 0;               /* Prevents controls from shrinking oddly */
        }
        .last-updated {
            margin: 0; /* Remove default paragraph margin */
            font-size: 0.8em;
            color: var(--text-very-subtle);
            white-space: nowrap; /* Prevents "<span data-i18n="dashboard.last_updated">Last updated:</span>" text from wrapping */
        }


        .panels-container {
            display: flex;
            flex-direction: row; /* Horizontal on desktop */
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            flex: 1 1 0;
            width: 0;
            background: var(--panel-bg); border: 1px solid var(--border-color);
            
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .panel:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow);
        }
        .panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .panel .panel-header h3 {
            margin: 0;
            padding: 0;
            border: none;
        }
        .edit-stats-btn {
            font-size: 0.8em;
            cursor: pointer;
            background-color: var(--text-subtle);
            color: var(--header-text);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .edit-stats-btn:hover {
            background-color: var(--text-muted);
        }

        /* --- Edit Mode Styles for Stats --- */
        .vehicle-stats.edit-mode .stat {
            cursor: move;
            position: relative;
            padding-left: 35px; /* Make space for checkbox */
            opacity: 1;
            background-color: var(--panel-bg);
            border: 1px dashed var(--border-color);
        }
        .vehicle-stats.edit-mode .stat.disabled {
            opacity: 0.5;
            background-color: var(--table-stripe-bg);
        }
        .vehicle-stats.edit-mode .stat input[type="checkbox"] {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .sortable-ghost {
            background: var(--nav-active);
            opacity: 0.7;
        }

        .small-btn {
            padding: 4px 8px;
            font-size: 0.8em;
            background-color: var(--text-subtle);
            color: var(--header-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .small-btn:hover { background-color: var(--text-muted); }
        .small-btn:disabled { background-color: var(--text-subtle); cursor: not-allowed; }

        /* --- MODIFIED CSS FOR ROBUST GRID LINES --- */
        .vehicle-stats {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two-column layout */
            gap: 1px;                      /* This creates the grid lines */
            background-color: var(--border-color);     /* This is the color of the grid lines */
            border: 1px solid var(--border-color);     /* Keeps the outer border consistent */
            border-radius: 8px;
            overflow: hidden;              /* Clips children to the rounded corners */
            margin-bottom: 20px;
        }
        .stat {
            padding: 12px 15px;
            background-color: var(--panel-bg); /* All cells have a solid background */
        }
        .stat h3 { margin: 0 0 4px 0; font-size: 0.8em; color: var(--text-very-subtle); text-transform: uppercase; }
        .stat p { margin: 0; font-size: 1.3em; font-weight: bold; }
        
        .charts { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .charts { height: 350px; }

        .chart-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 4px 15px;
            margin-bottom: 15px;
        }
        .chart-controls label {
            grid-row: 1;
            font-weight: normal;
            font-size: 0.9em;
            color: var(--text-color);
        }
        .chart-controls .input-container {
             grid-row: 2;
        }
        .chart-controls .input-container, .chart-controls select {
            width: 100%;
        }
        .chart-controls .input-with-icon {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .chart-controls select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .chart-icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px;
            cursor: pointer;
            height: 32px;
            width: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s;
        }
        .chart-icon-btn:hover {
            border-color: var(--text-color);
        }
        .chart-icon-btn svg {
            fill: var(--text-subtle);
            transition: fill 0.2s ease-in-out;
        }
        .chart-icon-btn.active svg {
            fill: var(--accent-color);
        }


        .location-map-container {
            height: 250px;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            
        }
        .location-map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .map-title {
            text-align: center;
            font-size: 1.1em;
            color: var(--text-color);
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .vin { font-size: 0.8em; color: var(--text-subtle); text-align: center; margin-top: 20px; }

        .status-list { list-style: none; padding: 0; margin: 0; font-size: 0.9em; }
        .status-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid var(--border-color); }
        .status-list li:last-child { border-bottom: none; }
        .status-icon { font-size: 1.4em; font-weight: bold; min-width: 25px; text-align: center; }
        .status-list li.open .status-icon { color: var(--error-text); }
        .status-list li.closed .status-icon { color: var(--success-text); }
        .status-list li.locked .status-icon { color: var(--accent-color); }
        .status-list li.unknown .status-icon { color: var(--text-subtle); }

        .lock-status-text { font-weight: normal; font-size: 0.9em; margin-left: 8px; }
        .lock-status-text.locked { color: var(--success-text); }
        .lock-status-text.unlocked { color: var(--error-text); }
        .open-status-text {
            font-size: 0.9em;
            font-weight: bold;
            color: var(--error-text);
            margin: -10px 0 15px 0;
            padding: 0 5px;
        }
        .status-timestamp {
            font-size: 0.8em;
            color: var(--text-subtle);
            margin: -10px 0 15px 5px;
            font-style: italic;
        }

        @media (max-width: 900px) {
            .panels-container {
                flex-direction: column;
            }
            .panel {
                width: auto;
            }
        }
        
        @media (max-width: 600px) {
            .vehicle-stats {
                grid-template-columns: 1fr; /* Single column layout for mobile */
            }
            .chart-controls {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, auto);
                gap: 4px;
            }
            .chart-controls label { grid-row: unset; }
            .chart-controls .input-container { grid-row: unset; }

            .chart-controls label[for="chart-metric-left-axis"] { grid-row: 1; }
            .chart-controls .input-container.left-axis { grid-row: 2; }

            .chart-controls label[for="chart-metric-right-axis"] { grid-row: 3; }
            .chart-controls .input-container.right-axis { grid-row: 4; }

            .chart-controls label[for="chart-period-select"] { grid-row: 5; }
            .chart-controls .input-container.period { grid-row: 6; }
        }


        .summary-panel {
            background: var(--accent-color);
            color: var(--header-text);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }
        .summary-panel h2 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }
        .summary-stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .summary-stat {
            flex: 1;
            min-width: 150px;
        }
        .summary-stat p {
            font-size: 2em;
            font-weight: bold;
            margin: 0;
        }
    </style>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="/static/js/i18n.js?v={{ cache_buster }}"></script>
</head>
<body>

    <main id="vehicle-container"></main>

    <template id="vehicle-template">
        <div class="vehicle-wrapper">
            <div class="vehicle-header">
                <div class="vehicle-title-group" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <div>
                        <h2 class="alias" style="margin: 0;"></h2>
                        <p class="model-name" style="margin: 0;"></p>
                    </div>
                    <select class="vehicle-select" style="display: none; padding: 5px; border-radius: 4px; background: var(--panel-bg); color: var(--text-color); border: 1px solid var(--border-color); font-size: 1em;"></select>
                </div>
                <div class="vehicle-controls">
                    <button class="small-btn force-poll" data-i18n="dashboard.refresh_data">Refresh Data</button>
                    <p class="last-updated"><span data-i18n="dashboard.last_updated">Last updated:</span> <span class="last-updated-time" data-i18n="dashboard.never">Never</span></p>
                </div>
            </div>

            <div class="panels-container">
                <div class="panel stats-panel">
                    <div class="panel-header">
                        <h3 data-i18n="dashboard.current_statistics">Current Statistics</h3>
                        <button class="edit-stats-btn" data-i18n="dashboard.edit">Edit</button>
                    </div>
                    <div class="vehicle-stats">
                        <!-- All stat divs will now be generated by main.js -->
                    </div>
                    <h3 class="map-title" data-i18n="dashboard.location">Current Location of Car</h3>
                    <div class="location-map-container">
                        <p style="text-align: center; padding-top: 50px; color: var(--text-subtle);"><span data-i18n="dashboard.location_unavailable">Location data not available.</span></p>
                    </div>
                </div>

                <div class="panel charts-panel">
                    <div class="panel-header">
                        <h3 data-i18n="dashboard.historical_data">Historical Data</h3> <h3 style="display:inline; margin-left: 10px;"><span class="trip-count"></span></h3>
                    </div>
                    <div class="chart-controls">
                        <label for="chart-metric-left-axis" data-i18n="dashboard.left_axis">Left Axis:</label>
                        <label for="chart-metric-right-axis" data-i18n="dashboard.right_axis">Right Axis:</label>
                        <label for="chart-period-select" data-i18n="dashboard.period_label">Period:</label>
                        
                        <div class="input-container left-axis">
                            <div class="input-with-icon">
                                <select id="chart-metric-left-axis" class="chart-metric-select" data-axis="left">
                                    <option value="distance_km" selected data-i18n="dashboard.metrics.distance_km">Distance</option>
                                    <option value="fuel_consumption_l_100km" data-i18n="dashboard.metrics.fuel_consumption_l_100km">Consumption</option>
                                    <option value="ev_distance_km" data-i18n="dashboard.metrics.ev_distance_km">EV Distance</option>
                                    <option value="ev_duration_seconds" data-i18n="dashboard.metrics.ev_duration_seconds">EV Duration</option>
                                    <option value="score_global" data-i18n="dashboard.metrics.score_global">Driving Score</option>
                                    <option value="average_speed_kmh" data-i18n="dashboard.metrics.average_speed_kmh">Average Speed</option>
                                    <option value="max_speed_kmh" data-i18n="dashboard.metrics.max_speed_kmh">Max Speed</option>
                                    <option value="duration_seconds" data-i18n="dashboard.metrics.duration_seconds">Trip Duration</option>
                                </select>
                                <button class="chart-icon-btn histogram-toggle-btn" title="Toggle Histogram View">
                                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px">
                                        <path d="M0 0h24v24H0V0z" fill="none"/>
                                        <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/>
                                    </svg>
                                </button>
                                <button class="chart-icon-btn rolling-avg-btn" data-axis="left" title="Toggle 7-day Rolling Average">
                                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px">
                                        <path d="M0 0h24v24H0V0z" fill="none"/><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="input-container right-axis">
                            <div class="input-with-icon">
                                <select id="chart-metric-right-axis" class="chart-metric-select" data-axis="right">
                                    <option value="none" selected data-i18n="dashboard.metrics.none">None</option>
                                    <option value="distance_km" data-i18n="dashboard.metrics.distance_km">Distance</option>
                                <option value="fuel_consumption_l_100km" data-i18n="dashboard.metrics.fuel_consumption_l_100km">Consumption</option>
                                <option value="ev_distance_km" data-i18n="dashboard.metrics.ev_distance_km">EV Distance</option>
                                <option value="ev_duration_seconds" data-i18n="dashboard.metrics.ev_duration_seconds">EV Duration</option>
                                <option value="score_global" data-i18n="dashboard.metrics.score_global">Driving Score</option>
                                <option value="average_speed_kmh" data-i18n="dashboard.metrics.average_speed_kmh">Average Speed</option>
                                <option value="max_speed_kmh" data-i18n="dashboard.metrics.max_speed_kmh">Max Speed</option>
                                <option value="duration_seconds" data-i18n="dashboard.metrics.duration_seconds">Trip Duration</option>
                            </select>
                            <button class="chart-icon-btn rolling-avg-btn" data-axis="right" title="Toggle 7-day Rolling Average">
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px">
                                    <path d="M0 0h24v24H0V0z" fill="none"/><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/>
                                </svg>
                            </button>
                        </div>
                        </div>
                        
                        <div class="input-container period">
                             <select id="chart-period-select" class="chart-period-select">
                                <option value="7">Last <span data-i18n="dashboard.days_7">7 Days</span></option>
                                <option value="30" selected>Last <span data-i18n="dashboard.days_30">30 Days</span></option>
                                <option value="90" data-i18n="dashboard.last_90_days">Last 90 Days</option>
                                <option value="365" data-i18n="dashboard.last_year">Last Year</option>
                                <option value="all"><span data-i18n="dashboard.all_time">All Time</span></option>
                            </select>
                        </div>
                    </div>
                    <div class="charts">
                        <canvas class="history-chart"></canvas>
                    </div>
                    <div class="chart-summary"></div>
                </div>

                <div class="panel status-panel">
                    <div class="panel-header">
                        <h3><span data-i18n="dashboard.vehicle_status">Vehicle Status</span> <span class="lock-status-text"></span></h3>
                    </div>
                    <p class="status-timestamp"><span data-i18n="dashboard.status_as_of">Status as of:</span> <span>N/A</span></p>
                    <p class="lock-status-error" style="display: none; color: var(--error-text); font-weight: bold; margin: -10px 0 15px 5px;"></p>
                    <p class="open-status-text"></p>
                    <ul class="status-list">
                        <li data-status-key="doors.front_left"><span data-i18n="dashboard.status.front_left_door">Front Left Door</span><span class="status-icon">N/A</span></li>
                        <li data-status-key="doors.front_right"><span data-i18n="dashboard.status.front_right_door">Front Right Door</span><span class="status-icon">N/A</span></li>

    <script src="/static/js/utils.js?v={{ cache_buster }}"></script>
    <script src="/static/js/main.js?v={{ cache_buster }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            const iconLight = document.getElementById('theme-icon-light');
            const iconDark = document.getElementById('theme-icon-dark');
            
            if (!toggleBtn) return;

                        function updateIcon(theme) {
                if (theme === 'dark' || theme === 'dim') {
                    iconLight.style.display = 'block';
                    iconDark.style.display = 'none';
                } else {
                    iconLight.style.display = 'none';
                    iconDark.style.display = 'block';
                }
            }

            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            updateIcon(currentTheme);

                        toggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const themes = ['light', 'dark', 'dim'];
                const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
                const newTheme = themes[nextIndex];
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateIcon(newTheme);
                
                window.dispatchEvent(new Event('themeChanged'));
            });
        });
    </script>
