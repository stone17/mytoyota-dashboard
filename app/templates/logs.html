<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - Vehicle Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ cache_buster }}">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <script src="/static/js/i18n.js?v={{ cache_buster }}"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-title" data-i18n="dashboard.title">Vehicle Dashboard</div>
        <nav class="main-nav">
            <a href="/" class="nav-link">

                <span data-i18n="nav.dashboard">Dashboard</span>
            </a>
            <a href="/trips" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11C5.84 5 5.28 5.42 5.08 6.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"></path></svg>
                <span data-i18n="nav.trips">Trip History</span>
            </a>
            <a href="/notifications" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg>
                <span data-i18n="nav.notifications">Notifications</span>
            </a>
            <a href="/logs" class="nav-link active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"></path></svg>
                <span data-i18n="nav.logs">Logs</span>
            </a>
            <a href="/settings" class="nav-link">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61-.25-1.17.59-1.69-.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24-.42.12-.64l2 3.46c.12.22.39.3.61-.22l2.49-1c.52.4 1.08.73 1.69-.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49-1c.23-.09.49 0 .61-.22l2-3.46c-.12-.22-.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"></path></svg>
                <span data-i18n="nav.settings">Settings</span>
            </a>
        </nav>
        <div class="header-extra">
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">
                <svg class="nav-icon" id="theme-icon-light" viewBox="0 0 24 24" style="display: none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"></path></svg>
                <svg class="nav-icon" id="theme-icon-dark" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"></path></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="settings-section log-settings-container">
            <div class="form-group">
                <label for="app-log-level">Application Log Level</label>
                <select id="app-log-level" name="app_log_level">
                    <option value="DEBUG" data-i18n="logs.debug">Debug</option>
                    <option value="INFO" data-i18n="logs.info">Info</option>
                    <option value="WARNING" data-i18n="logs.warning">Warning</option>
                    <option value="ERROR" data-i18n="logs.error">Error</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div class="form-group">
                <label for="log-history-size">Log History Size</label>
                <input type="number" id="log-history-size" name="log_history_size" min="10" max="5000" title="Number of recent log lines to keep in memory for the Logs page. A restart is required for this change to take effect.">
            </div>
            <button type="button" id="save-log-settings-btn" data-i18n="logs.save">Save Settings</button>
            <p id="log-settings-status-message" class="status-message"></p>
        </section>
        <section class="settings-section">
            <div class="logs-header">
                <h2>Live Log Stream</h2>
            </div>
            <div id="log-content" class="logs-container">
                Connecting to log stream...
            </div>
        </section>
    </main>

    <script src="/static/js/utils.js?v={{ cache_buster }}"></script>
    <script src="/static/js/logs.js?v={{ cache_buster }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            const iconLight = document.getElementById('theme-icon-light');
            const iconDark = document.getElementById('theme-icon-dark');
            
            if (!toggleBtn) return;

                        function updateIcon(theme) {
                if (theme === 'dark' || theme === 'dim') {
                    iconLight.style.display = 'block';
                    iconDark.style.display = 'none';
                } else {
                    iconLight.style.display = 'none';
                    iconDark.style.display = 'block';
                }
            }

            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            updateIcon(currentTheme);

                        toggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const themes = ['light', 'dark', 'dim'];
                const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
                const newTheme = themes[nextIndex];
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateIcon(newTheme);
                
                window.dispatchEvent(new Event('themeChanged'));
            });
        });
    </script>
</body>
</html>
